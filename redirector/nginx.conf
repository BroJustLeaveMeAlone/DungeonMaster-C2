# DungeonMaster redirector
# Forwards agent C2 callbacks to the team server; drops all other traffic.
# Deploy on an external VPS. Point your DNS at this box, not the team server.

upstream teamserver {
    # Override with: DM_TEAMSERVER_ADDR env var or edit directly
    server 127.0.0.1:4443;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Agent registration
    location = /r {
        proxy_pass         https://teamserver;
        proxy_ssl_verify   off;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Agent poll + output
    location = /c {
        proxy_pass         https://teamserver;
        proxy_ssl_verify   off;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
        proxy_connect_timeout 5s;
    }

    # Drop everything else — present a realistic-looking 404
    location / {
        return 404;
    }
}

# Redirect plain HTTP so the redirector doesn't stand out as port-80-dead
server {
    listen 80;
    return 301 https://$host$request_uri;
}
